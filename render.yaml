services:
  - type: web
    name: binance-insight-web
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py bootstrap_app
    startCommand: gunicorn binance_insight.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: binance-insight-db
          property: connectionString
      - key: BINANCE_MODE
        value: paper
      - key: LIVE_TRADING_ENABLED
        value: false
  - type: worker
    name: binance-insight-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py market_worker --seconds 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: binance-insight-db
          property: connectionString
      - key: BINANCE_MODE
        value: paper
      - key: LIVE_TRADING_ENABLED
        value: false
databases:
  - name: binance-insight-db
    databaseName: binance_insight
    user: binance_insight
